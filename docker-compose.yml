version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    expose:
      - "6379"

  db-migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: deps
    command: >
      sh -c "cd /app && pnpm --filter=@melotech/db db:push"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV}
      AI_PROVIDER: ${AI_PROVIDER}
      AI_MODEL: ${AI_MODEL}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      GENERATION_RETRY_LIMIT: ${GENERATION_RETRY_LIMIT}
      LLM_REPAIR_RETRY_LIMIT: ${LLM_REPAIR_RETRY_LIMIT}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD}
      PLATFORM_CREDIT_COST_SPOTIFY: ${PLATFORM_CREDIT_COST_SPOTIFY}
      PLATFORM_CREDIT_COST_TIKTOK: ${PLATFORM_CREDIT_COST_TIKTOK}
      PLATFORM_CREDIT_COST_YOUTUBE: ${PLATFORM_CREDIT_COST_YOUTUBE}
    expose:
      - "3000"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AI_PROVIDER: ${AI_PROVIDER}
      AI_MODEL: ${AI_MODEL}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      GENERATION_RETRY_LIMIT: ${GENERATION_RETRY_LIMIT}
      LLM_REPAIR_RETRY_LIMIT: ${LLM_REPAIR_RETRY_LIMIT}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD}
      PLATFORM_CREDIT_COST_SPOTIFY: ${PLATFORM_CREDIT_COST_SPOTIFY}
      PLATFORM_CREDIT_COST_TIKTOK: ${PLATFORM_CREDIT_COST_TIKTOK}
      PLATFORM_CREDIT_COST_YOUTUBE: ${PLATFORM_CREDIT_COST_YOUTUBE}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
